<!-- Angular Rule 1: Property binding sets tooltip; interpolation renders title text -->
<td style="padding: 10px;">                                                                                                                                                                                                      
  #{{ index + 1 }} of {{ total }}                                                                                                                                                    
</td> 

<!-- Angular Rule 2: [style.opacity] style binding dims draft documents visually -->
<td style="padding: 10px;" [title]="documentData.title"
  [style.opacity]="documentData.status === 'Draft' ? '0.65' : '1'">
  {{ documentData.title }}
</td>

<td style="padding: 10px;">                                                                                                                                                                                                      
  <div class="tags-container" style="display: flex; gap: 4px; flex-wrap: wrap;">                                                                                                                                                 
    @for (tag of documentData.tags; track tag) {                                                                                                                                                                                 
      <span style="background: #e2e8f0; color: #334155; padding: 2px 8px; border-radius: 12px; font-size: 12px;">                                                                                                                
        #{{ tag }}                                                                                                                                                                                                               
      </span>                                                                                                                                                                                                                    
    }                                                                                                                                                                                                                            
  </div>                                                                                                                                                                                                                         
</td>  

<td style="padding: 10px;">                                                                                                                                                                                                      
@switch (documentData.status) {
  @case ('Approved') {
    <span style="color: green; font-weight: bold;">Approved</span>
  }
  @case ('Draft') {
    <span style="color: orange; font-weight: bold;">Draft</span>
  }
  @default {
    <span>{{ documentData.status }}</span>
  }
}
</td>

<!-- Angular Rule 3: (click) event bindings trigger navigation and delete actions -->
<td style="padding: 10px;">
  <button (click)="viewItem()"
    style="color: white; background: #3591dc; border: none; padding: 4px 8px; cursor: pointer; border-radius: 3px;">View Details</button>
  <button (click)="editItem()"
    style="color: white; background: #edad17; border: none; padding: 4px 8px; cursor: pointer; border-radius: 3px;">
    {{ isEditing ? 'Editing...' : 'Edit' }}
  </button>
  <button (click)="emitDelete()"
    [disabled]="isEditing"
    [title]="isEditing ? 'Cannot remove document while it is actively being edited below' : 'Remove document'"
    [style.opacity]="isEditing ? '0.45' : '1'"
    [style.cursor]="isEditing ? 'not-allowed' : 'pointer'"
    style="color: white; background: #dc3545; border: none; padding: 4px 8px; border-radius: 3px;">Remove</button>
</td>
