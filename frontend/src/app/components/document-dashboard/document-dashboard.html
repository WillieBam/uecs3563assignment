<div style="margin-top: 20px;">
  <h3>Active Sort Strategy: {{ currentSort }}</h3>

  <button (click)="navigateToForm()" style="margin-bottom: 15px; padding: 8px 12px; cursor: pointer;">
    Add Knowledge Document
  </button>

  <table border="1" style="width: 100%; border-collapse: collapse; text-align: left;">
    <thead>
      <tr style="background-color: #f2f2f2;">
        <th style="padding: 10px;">Title</th>
        <th style="padding: 10px;">Status</th>
        <th style="padding: 10px;">Actions</th>
      </tr>
    </thead>
    <tbody>
      @for (doc of documents; track doc.id; let idx = $index, total = $count, isFirst = $first) {
        <tr app-document-row 
            [documentData]="doc" 
            (deleteRequest)="onDeleteTriggered($event)">
        </tr>
      } @empty {
        <tr><td colspan="3" style="padding: 10px; text-align: center;">No corporate documentation stored.</td></tr>
      }
    </tbody>
  </table>
</div>
