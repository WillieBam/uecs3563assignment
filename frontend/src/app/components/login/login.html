<div style="max-width: 420px; margin: 60px auto; padding: 25px; border: 1px solid #ddd; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); background: #fff;">
  <h2 style="margin-top: 0; color: #1e293b; text-align: center;">KMS Team Login</h2>
  <p style="text-align: center; color: #64748b; font-size: 14px;">Sign in to access team knowledge base</p>

  <div *ngIf="errorMessage" style="padding: 10px; background: #fee2e2; color: #991b1b; border-radius: 4px; margin-bottom: 15px; font-size: 14px;">
    {{ errorMessage }}
  </div>

  <form (ngSubmit)="onLogin()">
    <div style="margin-bottom: 15px;">
      <label style="display: block; margin-bottom: 5px; font-weight: 500; font-size: 14px;">Username</label>
      <input type="text" [(ngModel)]="username" name="username" required
        style="width: 100%; padding: 8px 12px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;"
        placeholder="Enter username" />
    </div>

    <div style="margin-bottom: 20px;">
      <label style="display: block; margin-bottom: 5px; font-weight: 500; font-size: 14px;">Password</label>
      <input type="password" [(ngModel)]="password" name="password" required
        style="width: 100%; padding: 8px 12px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;"
        placeholder="Enter password" />
    </div>

    <button type="submit"
      style="width: 100%; padding: 10px; background: #2563eb; color: #fff; border: none; border-radius: 4px; font-weight: 600; cursor: pointer;">
      Sign In
    </button>
  </form>
</div>
